<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uzy Modas — Vem Ficar Mais Linda Aqui!</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--rosa:#c8005a;--rosa2:#e8006a;--rosa-light:#fce4f0;--rosa-dark:#8a003d;--preto:#0a0a0a;--cream:#fff9fc;--muted:#888;--border:rgba(200,0,90,0.15)}
  body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--preto)}

  header{background:var(--preto);padding:0 1.2rem;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;height:66px;border-bottom:2px solid var(--rosa)}
  .logo-area{display:flex;align-items:center;gap:10px}
  .logo-circle{width:46px;height:46px;background:#0a0a0a;border-radius:50%;border:1.5px solid var(--rosa);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .logo-text-wrap{display:flex;flex-direction:column}
  .logo-nome{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;letter-spacing:2px;color:#fff;line-height:1}
  .logo-sub{font-size:8px;letter-spacing:1.5px;color:rgba(255,255,255,0.35);text-transform:uppercase;margin-top:2px}
  .header-btns{display:flex;align-items:center;gap:8px}
  .wpp-header{background:var(--rosa);color:#fff;border:none;padding:7px 13px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Outfit',sans-serif;text-decoration:none}
  .maps-header{background:transparent;color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.2);padding:7px 13px;border-radius:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Outfit',sans-serif;text-decoration:none}
  .maps-header:hover{border-color:var(--rosa);color:var(--rosa)}

  .hero{background:var(--preto);padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 60% 40%,rgba(200,0,90,0.18) 0%,transparent 65%)}
  .hero-logo{position:relative;z-index:1;margin-bottom:1rem;display:flex;justify-content:center}
  .hero-logo-circle{width:100px;height:100px;background:#0a0a0a;border-radius:50%;border:2px solid var(--rosa);display:flex;align-items:center;justify-content:center}
  .hero-tag{display:inline-block;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--rosa);border:1px solid rgba(200,0,90,0.4);padding:4px 14px;border-radius:20px;margin-bottom:.8rem;position:relative;z-index:1}
  .hero h1{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:400;color:#fff;line-height:1.15;letter-spacing:1px;position:relative;z-index:1}
  .hero h1 em{color:var(--rosa);font-style:italic}
  .hero p{color:rgba(255,255,255,0.45);font-size:12px;margin-top:.6rem;font-weight:300;position:relative;z-index:1;letter-spacing:1px}

  .location-bar{background:var(--rosa);padding:.6rem 1.5rem;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .location-bar span{color:#fff;font-size:12px;font-weight:400;letter-spacing:.5px}

  .filters{background:#fff;border-bottom:2px solid var(--border);padding:.6rem 1.2rem;display:flex;gap:6px;overflow-x:auto;position:sticky;top:66px;z-index:40}
  .filters::-webkit-scrollbar{display:none}
  .filter-btn{border:1px solid var(--border);background:transparent;color:var(--muted);padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:'Outfit',sans-serif;transition:all .2s}
  .filter-btn.ativo{background:var(--rosa);color:#fff;border-color:var(--rosa)}
  .filter-btn:hover:not(.ativo){border-color:var(--rosa);color:var(--rosa)}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;padding:1.2rem 1.5rem .7rem}
  .section-head h2{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400}
  .count{font-size:12px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;padding:0 1.2rem 3rem}
  .card{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(200,0,90,0.12)}
  .card-img{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:54px;position:relative}
  .bg-rose{background:#fce4f0}.bg-lilas{background:#f0eaf7}.bg-azul{background:#e8f0f9}.bg-verde{background:#e8f5ee}.bg-preto{background:#f0f0f0}.bg-floral{background:#fef0f4}.bg-bege{background:#f5f0e6}.bg-nude{background:#f9f0e8}
  .card-badge{position:absolute;top:8px;left:8px;font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:10px}
  .badge-promo{background:var(--rosa);color:#fff}.badge-novo{background:var(--preto);color:var(--rosa)}.badge-esg{background:rgba(0,0,0,0.07);color:var(--muted)}
  .card-body{padding:10px 12px 12px}
  .card-nome{font-size:13px;font-weight:500;margin-bottom:2px}
  .card-tam{font-size:11px;color:var(--muted);margin-bottom:8px}
  .card-foot{display:flex;align-items:center;justify-content:space-between}
  .preco-old{font-size:11px;color:var(--muted);text-decoration:line-through;display:block;line-height:1.2}
  .preco{font-size:15px;font-weight:500;color:var(--rosa)}
  .btn-wpp{background:var(--rosa);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .card.esgotado{opacity:.55;pointer-events:none}

  .overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.8);z-index:200;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-top:3px solid var(--rosa)}
  .modal-handle{width:40px;height:4px;background:rgba(200,0,90,0.25);border-radius:2px;margin:12px auto 0}
  .modal-img{width:100%;height:220px;display:flex;align-items:center;justify-content:center;font-size:70px}
  .modal-body{padding:1.5rem}
  .modal-nome{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;margin-bottom:6px}
  .modal-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:1rem}
  .modal-preco{font-size:26px;font-weight:500;color:var(--rosa);margin-bottom:4px}
  .modal-preco-old{font-size:13px;color:var(--muted);text-decoration:line-through;margin-bottom:1rem}
  .tam-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .tam-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
  .tam-btn{border:1px solid var(--border);background:transparent;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:'Outfit',sans-serif;color:var(--preto);transition:all .15s}
  .tam-btn.sel{border-color:var(--rosa);background:var(--rosa);color:#fff}
  .btn-wpp-modal{width:100%;background:var(--rosa);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Outfit',sans-serif;margin-bottom:10px}
  .btn-maps-modal{width:100%;background:transparent;border:1px solid var(--border);border-radius:12px;padding:11px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Outfit',sans-serif;color:var(--rosa);margin-bottom:10px;text-decoration:none}
  .btn-fechar{width:100%;background:transparent;border:1px solid rgba(0,0,0,0.1);border-radius:12px;padding:11px;font-size:13px;cursor:pointer;font-family:'Outfit',sans-serif;color:var(--muted)}

  footer{background:var(--preto);color:rgba(255,255,255,0.4);text-align:center;padding:1.5rem;font-size:11px;border-top:2px solid var(--rosa)}
  footer a{color:var(--rosa);text-decoration:none}
  .footer-slogan{color:var(--rosa);font-style:italic;font-size:13px;margin-bottom:6px;font-family:'Cormorant Garamond',serif}
</style>
</head>

];
const corBg={rose:'bg-rose',lilas:'bg-lilas',azul:'bg-azul',verde:'bg-verde',preto:'bg-preto',floral:'bg-floral',bege:'bg-bege',nude:'bg-nude'};
let pecas=[],catAtiva='all',tamSel=null,pecaAtual=null;
function carregar(cat){
  let lista=PECAS.filter(p=>p.status!=='arquivado');
  if(cat==='sale')lista=lista.filter(p=>p.preco_original);
  else if(cat!=='all')lista=lista.filter(p=>p.categoria===cat);
  pecas=lista;
  const nomes={all:'Coleção completa',vestido:'Vestidos',blusa:'Blusas',conjunto:'Conjuntos',calca:'Calças',sale:'Promoções'};

  document.getElementById('count-label').textContent=lista.length+' peça'+(lista.length!==1?'s':'');
  document.getElementById('grid').innerHTML=lista.map((p,i)=>{
    const bg=corBg[p.cor]||'bg-bege';
    const badge=p.status==='esgotado'?'<div class="card-badge badge-esg">Esgotado</div>':p.preco_original?'<div class="card-badge badge-promo">Promoção</div>':i<2?'<div class="card-badge badge-novo">Novo</div>':'';
    return`<div class="card${p.status==='esgotado'?' esgotado':''}" onclick="abrirModal('${p.id}')">
      <div class="card-img ${bg}">${badge}<span>${p.emoji}</span></div>

        <div class="card-nome">${p.nome}</div>
        <div class="card-tam">${p.tamanhos.join(' · ')||'Tamanho único'}</div>
        <div class="card-foot">

}
function abrirModal(id){
  pecaAtual=pecas.find(p=>p.id===id);if(!pecaAtual)return;tamSel=null;
  const bg=corBg[pecaAtual.cor]||'bg-bege';
  document.getElementById('m-img').innerHTML=`<span>${pecaAtual.emoji}</span>`;
  document.getElementById('m-img').className='modal-img '+bg;
  document.getElementById('m-nome').textContent=pecaAtual.nome;
  document.getElementById('m-desc').textContent=pecaAtual.descricao;
  document.getElementById('m-preco').textContent=`R$ ${pecaAtual.preco.toFixed(2).replace('.',',')}`;
  document.getElementById('m-preco-old').innerHTML=pecaAtual.preco_original?`<div class="modal-preco-old">De R$ ${pecaAtual.preco_original.toFixed(2).replace('.',',')}</div>`:'';
  document.getElementById('m-tam').innerHTML=pecaAtual.tamanhos.length?pecaAtual.tamanhos.map(t=>`<button class="tam-btn" onclick="selTam(this,'${t}')">${t}</button>`).join(''):'<span style="font-size:12px;color:#888">Tamanho único</span>';
  document.getElementById('m-wpp-btn').onclick=()=>wpp(pecaAtual.id);
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function selTam(btn,tam){document.querySelectorAll('.tam-btn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');tamSel=tam;}
function fecharModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';}
function wpp(id){
  const p=pecas.find(x=>x.id===id)||pecaAtual;if(!p)return;
  const tam=tamSel?` — Tamanho ${tamSel}`:'';
  const msg=encodeURIComponent(`Olá! Vi na vitrine online da Uzy Modas e quero saber mais sobre:\n\n*${p.nome}*${tam}\nPreço: R$ ${p.preco.toFixed(2).replace('.',',')}\n\nAinda disponível? 😊`);
  window.open(`https://wa.me/559591611196?text=${msg}`,'_blank');
}
document.getElementById('filters').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');if(!btn)return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('ativo'));
  btn.classList.add('ativo');catAtiva=btn.dataset.cat;carregar(catAtiva);
});
carregar('all');
</script>
